<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#EEF4F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A171B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="УС УУ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>УС УУ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column. Main screen = drop total (tap for details) + amount picker + Add/Remove at thumb height.
   Details (day/week history, hourly graph, tips) and Settings open as full-screen panels (#pDetails, #pPrefs). */
:root {
  --bg: #EEF4F5;
  --surface: #FFFFFF;
  --fg: #0F2429;
  --muted: #587076;
  --line: #D6E3E6;
  --accent: #0B7C89;
  --accent-ink: #FFFFFF;
  --chip-on: #DDF1F4;
  --water: #4DBBCB;
  --water-back: #9ADAE4;
  --bar: #BFE3EA;
  --bar-met: #0B7C89;
  --glass-fill: #F7FBFC;
  --glass-line: #9DB9BF;
  --danger: #B3261E;
  --font-display: 'Unbounded', 'Manrope', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', system-ui, sans-serif;
  --font-body: 'Manrope', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A171B;
    --surface: #112429;
    --fg: #E4F1F3;
    --muted: #8CA8AE;
    --line: #223E45;
    --accent: #4CC2D1;
    --accent-ink: #06242A;
    --chip-on: #153940;
    --water: #2BA6BA;
    --water-back: #1B6C7B;
    --bar: #1F4650;
    --bar-met: #4CC2D1;
    --glass-fill: #0D1E23;
    --glass-line: #3C6670;
    --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A171B;
  --surface: #112429;
  --fg: #E4F1F3;
  --muted: #8CA8AE;
  --line: #223E45;
  --accent: #4CC2D1;
  --accent-ink: #06242A;
  --chip-on: #153940;
  --water: #2BA6BA;
  --water-back: #1B6C7B;
  --bar: #1F4650;
  --bar-met: #4CC2D1;
  --glass-fill: #0D1E23;
  --glass-line: #3C6670;
  --danger: #FF8A80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 500 16px/1.45 var(--font-body);
  font-variant-numeric: tabular-nums;
  padding-block: 12px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
button, input { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }

/* ---------- main screen ---------- */
.app {
  max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  min-height: calc(100vh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  min-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
.top { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
h1 { display: flex; align-items: center; gap: 10px; font: 700 22px/1 var(--font-display); letter-spacing: 0.02em; }
h1 svg { width: 22px; height: 26px; fill: var(--accent); }
.iconbtn { width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.iconbtn svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.hero {
  flex: 1 1 auto; min-height: 270px;
  display: flex; flex-direction: column; justify-content: center; gap: 10px;
  width: 100%; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
  padding: 16px; cursor: pointer;
}
.hero:hover { border-color: var(--accent); }
.hero .t { display: grid; justify-items: center; }
.hero .t > * { display: block; }
.gwrap { position: relative; flex: 1 1 0; min-height: 110px; max-height: 420px; width: 100%; }
.glass { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
.g-fill { fill: var(--glass-fill); }
.g-line { stroke: var(--glass-line); stroke-width: 2.5; stroke-linejoin: round; }
.water { fill: var(--water); }
.water-back { fill: var(--water-back); }
.level { transition: transform 0.9s cubic-bezier(0.3, 0.7, 0.2, 1); }
.wave { animation: drift 5s linear infinite; }
.wave.back { animation-duration: 8s; animation-direction: reverse; }
@keyframes drift { to { transform: translateX(-120px); } }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.big { font: 800 clamp(36px, 11vw, 50px)/1.05 var(--font-body); letter-spacing: -0.02em; margin-top: 2px; }
.big .unit { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.pill { display: inline-block; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.pill.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row2 { display: flex !important; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 14px; margin-top: 10px; }
.more { font-size: 14px; font-weight: 700; color: var(--accent); }

.note {
  display: none; position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 4;
  min-height: 52px; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px 0 16px;
  border-radius: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
}
.note.on, .note.err { display: flex; }
.note.on { background: var(--fg); color: var(--bg); }
.note.err { background: var(--surface); color: var(--danger); border: 2px solid var(--danger); }
.note button { min-height: 44px; padding: 0 16px; border: 0; background: transparent; color: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; }

.controls { position: relative; display: grid; gap: 10px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  flex: 1 0 56px; display: grid; gap: 2px; justify-items: center; align-content: center; min-height: 72px; padding: 8px 2px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.chip .n { font-size: 12px; font-weight: 600; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .v { font-size: 20px; font-weight: 800; line-height: 1.1; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--chip-on); }
.chip[aria-pressed="true"] .n { color: var(--fg); }
.custom { display: grid; grid-template-columns: 60px minmax(0, 1fr) 60px; gap: 8px; align-items: center; }
.sbtn { height: 60px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); font-size: 28px; font-weight: 700; cursor: pointer; }
.sbtn:hover:not(:disabled) { border-color: var(--accent); }
.field { position: relative; }
.field input { width: 100%; height: 60px; padding: 0 48px 0 14px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); font-size: 24px; font-weight: 800; text-align: center; }
.field .u { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }

.acts { display: grid; grid-template-columns: 1fr 1.7fr; gap: 10px; }
.act { display: grid; gap: 2px; justify-items: center; align-content: center; min-height: 76px; border-radius: 18px; cursor: pointer; border: 2px solid var(--accent); transition: transform 0.1s; }
.act:active:not(:disabled) { transform: scale(0.98); }
.act .a { font-size: 19px; font-weight: 800; }
.act .m { font-size: 14px; font-weight: 600; opacity: 0.85; }
.act.add { background: var(--accent); color: var(--accent-ink); }
.act.rem { background: var(--surface); color: var(--fg); }

/* ---------- panels ---------- */
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pwrap { max-width: 520px; margin: 0 auto; padding-block: 12px 40px; display: grid; gap: 22px; }
.vstack { display: grid; gap: 22px; }
.phead { display: flex; align-items: center; gap: 8px; min-height: 48px; }
.phead h2 { font: 700 20px/1.2 var(--font-display); }
.back { width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
.back svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sec h3 { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 52px; padding: 0 8px; border: 0; background: transparent; font-weight: 700; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.navr { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 8px; align-items: center; }
.navt { text-align: center; min-width: 0; }
.navm { font-size: 18px; font-weight: 800; }
.navs { font-size: 13px; color: var(--muted); min-height: 19px; }

.dsum .d { color: var(--muted); font-size: 14px; }
.dsum .s { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; margin-top: 2px; }
.dsum .s small { font-size: 16px; font-weight: 600; color: var(--muted); }

.log li { display: flex; align-items: center; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.log li:first-child { border-top: 1px solid var(--line); }
.log .tm { color: var(--muted); min-width: 84px; }
.log .am { font-weight: 700; flex: 1; }
.log .am.neg { color: var(--danger); }
.log .rm { width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; }
.log .rm:hover:not(:disabled) { background: var(--surface); color: var(--danger); }
.empty { color: var(--muted); padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

.weekbox { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.chart { display: block; width: 100%; height: auto; }
.bar { fill: var(--bar); }
.bar.met { fill: var(--bar-met); }
.base { stroke: var(--line); stroke-width: 1; }
.gridl { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.selmark { fill: var(--fg); }
.goal-line { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; }
.hit { cursor: pointer; }
.axis { font: 600 11px var(--font-body); fill: var(--muted); }
.c-val { font: 700 12px var(--font-body); fill: var(--muted); text-anchor: middle; }
.c-val.met { fill: var(--fg); }
.c-day { font: 600 12px var(--font-body); fill: var(--muted); text-anchor: middle; }
.c-day.now { fill: var(--fg); font-weight: 800; }
.hrread { font-weight: 700; margin-bottom: 8px; min-height: 24px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--bar-met); }
.sw.below { background: var(--bar); }
.sw.dash { background: none; height: 0; width: 18px; border-top: 1.5px dashed var(--muted); border-radius: 0; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.stats3 .k { font-size: 12px; color: var(--muted); }
.stats3 .v { font-size: 17px; font-weight: 800; margin-top: 2px; line-height: 1.25; }


/* settings */
.row { display: grid; gap: 10px; }
.row + .row { padding-top: 22px; border-top: 1px solid var(--line); }
.row .rl { font-weight: 800; font-size: 17px; }
.hintline { color: var(--muted); font-size: 14px; }
.hintline.warn { color: var(--danger); }
.hintline:empty { display: none; }
.stepper { display: inline-flex; align-items: center; justify-self: start; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.stepper button { width: 56px; height: 56px; border: 0; background: transparent; font-size: 26px; font-weight: 700; cursor: pointer; }
.stepper button:hover:not(:disabled) { background: var(--bg); }
.stepper input { width: 100px; height: 56px; border: 0; border-inline: 1px solid var(--line); background: transparent; text-align: center; font-size: 20px; font-weight: 800; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.status { color: var(--muted); font-size: 14px; }
.status.warn { color: var(--danger); }

.plist { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border: 2px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 700; cursor: pointer; }
.pchip i { font-style: normal; color: var(--muted); font-size: 18px; line-height: 1; }
.pchip:hover:not(:disabled) { border-color: var(--danger); }
.addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.addrow input { height: 52px; padding: 0 14px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); font-size: 18px; font-weight: 700; min-width: 0; }
.btn2 { min-height: 52px; padding: 0 18px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 700; cursor: pointer; }
.btn2:hover:not(:disabled) { border-color: var(--accent); }
.btn2.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<main class="app" id="app">
  <header class="top">
    <h1>
      <svg viewBox="0 0 22 26" aria-hidden="true"><path d="M11 1 C11 1 2 11.5 2 17 a9 9 0 0 0 18 0 C20 11.5 11 1 11 1 Z"/></svg>
      УС УУ
    </h1>
    <button type="button" class="iconbtn" id="openPrefs" data-i18n-aria="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <button type="button" class="hero" id="hero">
    <span class="t">
      <span class="eyebrow" data-i18n="today"></span>
      <span class="big"><span id="total">0</span><span class="unit" id="unit1"></span></span>
      <span class="sub" id="sub"></span>
      <span class="row2"><span class="pill" id="pill"></span><span class="more" id="moreLink"></span></span>
    </span>
    <span class="gwrap"><svg class="glass" id="glass" viewBox="0 0 136 262" aria-hidden="true">
      <defs>
        <clipPath id="gclip"><path d="M8 10 L128 10 L116 236 Q115 248 103 248 L33 248 Q21 248 20 236 Z"/></clipPath>
      </defs>
      <path class="g-fill" d="M8 10 L128 10 L116 236 Q115 248 103 248 L33 248 Q21 248 20 236 Z"/>
      <g clip-path="url(#gclip)">
        <g class="level" id="level" style="transform: translateY(262px)">
          <g class="wave back"><path class="water-back" d="M0 6 Q30 12 60 6 T120 6 T180 6 T240 6 T300 6 T360 6 T420 6 T480 6 V320 H0 Z"/></g>
          <g class="wave"><path class="water" d="M0 4 Q30 -2 60 4 T120 4 T180 4 T240 4 T300 4 T360 4 T420 4 T480 4 V320 H0 Z"/></g>
        </g>
      </g>
      <path class="g-line" fill="none" d="M8 10 L128 10 L116 236 Q115 248 103 248 L33 248 Q21 248 20 236 Z"/>
    </svg></span>
  </button>

  <section class="controls" aria-labelledby="lblAmount">
    <div class="note" id="note" role="status"><span id="noteText"></span><button type="button" id="undo" hidden></button></div>
    <p class="label" id="lblAmount" data-i18n="chooseAmount"></p>
    <div class="chips" id="chips"></div>
    <div class="custom" id="customRow" hidden>
      <button type="button" class="sbtn" id="cDown" data-i18n-aria="lower">−</button>
      <div class="field">
        <label class="sr" for="custom" data-i18n="amountLabel"></label>
        <input id="custom" type="number" inputmode="numeric" min="10" max="2000" step="10" value="250">
        <span class="u" id="unit2"></span>
      </div>
      <button type="button" class="sbtn" id="cUp" data-i18n-aria="raise">+</button>
    </div>
    <div class="acts">
      <button type="button" class="act rem" id="rem" data-live><span class="a" id="remA"></span><span class="m" id="remM"></span></button>
      <button type="button" class="act add" id="add" data-live><span class="a" id="addA"></span><span class="m" id="addM"></span></button>
    </div>
  </section>
</main>

<section class="panel" id="pDetails" role="dialog" aria-modal="true" aria-labelledby="tDetails" hidden>
  <div class="pwrap">
    <header class="phead">
      <button type="button" class="back" data-back data-i18n-aria="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button>
      <h2 id="tDetails" data-i18n="details"></h2>
    </header>

    <div class="seg" role="group" aria-labelledby="tDetails">
      <button type="button" data-vm="day" data-i18n="dayTab"></button>
      <button type="button" data-vm="week" data-i18n="weekTab"></button>
    </div>

    <div class="navr">
      <button type="button" class="back" id="navPrev" data-i18n-aria="prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button>
      <div class="navt"><p class="navm" id="navMain"></p><p class="navs" id="navSub"></p></div>
      <button type="button" class="back" id="navNext" data-i18n-aria="next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>

    <div class="vstack" id="dayView">
      <div class="dsum"><p class="s" id="dSum"></p></div>
      <section class="sec">
        <h3 data-i18n="hourly"></h3>
        <div class="weekbox">
          <p class="hrread" id="hrRead"></p>
          <svg class="chart" id="hrChart" viewBox="0 0 360 170" role="img"></svg>
        </div>
      </section>
      <section class="sec">
        <h3 data-i18n="drinks"></h3>
        <ul class="log" id="log"></ul>
      </section>
    </div>

    <div class="vstack" id="weekView" hidden>

      presetsLabel: 'Хэмжээний сонголтууд', presetsHint: 'Үндсэн дэлгэц дээрх хурдан сонголтууд. {n}/8 ашигласан.', presetAmount: 'Шинэ хэмжээ (мл)', addPreset: 'Нэмэх',

      statusLoading: 'Ачаалж байна…', statusSaving: 'Хадгалж байна…',

      added: '{n} ml 追加しました', removed: '{n} ml 減らしました', undo: '元に戻す',
      dayTab: '日', weekTab: '週', prev: '前へ', next: '次へ',
      hourly: '時間帯別', hourAria: '時間帯別の飲水量', peak: 'ピーク', noDrinks: '記録なし',
      drinks: '記録', none: 'この日の記録はありません。', delEntry: 'この記録を削除',
      chartAria: '7日間の飲水量', thisWeek: '今週', lastWeek: '先週', weeksAgo: '{n}週間前',
      legendMet: '目標達成', legendBelow: '目標未満', legendGoal: '目標 {n} ml',
      sMet: '目標達成', sMetVal: '7日中{n}日', sTotal: '合計', sBest: '最多の日', avgLbl: '1日平均',
      goalLabel: '1日の目標', lowerGoal: '目標を100 ml 減らす', raiseGoal: '目標を100 ml 増やす', goalUnit: '1日あたりのミリリットル',
      presetsLabel: '量のプリセット', presetsHint: 'メイン画面のクイック選択です。{n}/8 件使用中。', presetAmount: '新しい量 (ml)', addPreset: '追加',
      resetPresets: '初期値に戻す', removePreset: '{n} ml を削除', presetBad: '10〜2,000 ml の量を入力してください。',
      presetDup: 'その量はすでにあります。', presetMax: 'プリセットは最大8件までです。',
      langLabel: '言語', 
      storageLabel: '保存先', keepNote: '直近3週間分を保存します。それより古い日は自動で削除されます。',
      statusLoading: '読み込み中…', statusSaving: '保存中…',
      statusSavedDb: 'アカウントに保存済み', statusSavedLocal: 'この端末にのみ保存',
      statusErr: '保存できませんでした。接続を確認して、もう一度お試しください。',
      statusUnreach: '保存済みの記録に接続できません。接続が戻ると読み込まれます。',
      statusStale: '記録が最新でない可能性があります。再接続中…', statusUnavail: '保存済みの記録は現在利用できません。'
    }

  function detectLang() {
    var l = ((navigator.language || 'en') + '').toLowerCase();
    if (l.indexOf('ja') === 0) return 'ja';
    if (l.indexOf('mn') === 0) return 'mn';
    return 'en';
  }

  var state = {
    goal: 2000, lang: detectLang(), presets: DEFAULT_PRESETS.slice(),
    days: {}, loaded: false, sel: 250, custom: false
  };
  var view = { mode: 'day', offset: 0, hour: null };

  try {
    var savedSel = JSON.parse(localStorage.getItem('water-log-sel'));
    if (savedSel && savedSel.ml >= 10 && savedSel.ml <= 2000) { state.sel = savedSel.ml; state.custom = !!savedSel.custom; }
  } catch (e) {}
  function saveSel() { try { localStorage.setItem('water-log-sel', JSON.stringify({ ml: state.sel, custom: state.custom })); } catch (e) {} }

  var backend = null, mode = 'pending', renderedKey = '';
  var statusKey = 'statusLoading', statusKind = '';

  function t(key, v) {
    var s = STR[state.lang] && STR[state.lang][key];
    if (s == null) s = STR.en[key];
    if (s == null) return key;
    if (v) Object.keys(v).forEach(function (k) { s = s.split('{' + k + '}').join(v[k]); });
    return s;
  }
  var fmt = function (n) { return Math.round(n).toLocaleString('en-US'); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var keyOf = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var addDays = function (key, n) { var p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] + n, 12); };
  var todayKey = function () { return keyOf(new Date()); };
  var dayKeyAt = function (off) { return keyOf(addDays(todayKey(), -off)); };

  function fmtClock(h, m) {
    if (DEV12) {
      var h12 = h % 12 || 12;
      if (state.lang === 'ja') return (h < 12 ? '午前' : '午後') + h12 + ':' + pad(m);
      return h12 + ':' + pad(m) + ' ' + (h < 12 ? 'AM' : 'PM');
    }
    return pad(h) + ':' + pad(m);
  }
  function fmtTime(ts) { var d = new Date(ts); return fmtClock(d.getHours(), d.getMinutes()); }
  function hourLabel(h) {
    if (DEV12) return (h % 12 || 12) + (h < 12 ? 'AM' : 'PM');
    return pad(h);
  }
  function hourRange(h) { return fmtClock(h, 0) + ' – ' + fmtClock((h + 1) % 24, 0); }
  function fmtDate(d, opts) {
    try { return d.toLocaleDateString(LOC[state.lang], opts); } catch (e) { return d.toLocaleDateString(undefined, opts); }
  }

  function totalOf(key) {
    var d = state.days[key];
    var s = d ? d.entries.reduce(function (a, e) { return a + e.ml; }, 0) : 0;
    return Math.max(0, s);
  }
  function hourly(key) {
    var a = []; for (var i = 0; i < 24; i++) a.push(0);
    var d = state.days[key];
    if (d) d.entries.forEach(function (e) { a[new Date(e.t).getHours()] += e.ml; });
    return a.map(function (v) { return Math.max(0, v); });
  }

  /* ---------- settings helpers ---------- */
  function normPresets(arr) {
    var out = [];
    arr.forEach(function (v) { v = Math.round(Number(v)); if (v >= 10 && v <= 2000 && out.indexOf(v) < 0) out.push(v); });
    out.sort(function (a, b) { return a - b; });
    return out.slice(0, MAX_PRESETS);
  }
  function mergeSettings(data) {
    if (!data) return;
    if (typeof data.goal === 'number' && data.goal >= 500 && data.goal <= 6000) state.goal = data.goal;
    if (LOC[data.lang]) state.lang = data.lang;
    if (Array.isArray(data.presets)) state.presets = normPresets(data.presets);
    ensureSel();
  }
  function settingsObj() {
    return { goal: state.goal, lang: state.lang, presets: state.presets.slice() };
  }
  function ensureSel() {
    if (state.custom || !state.presets.length) { if (!state.presets.length) state.custom = true; return; }
    if (state.presets.indexOf(state.sel) < 0) {
      state.sel = state.presets.reduce(function (best, v) { return Math.abs(v - state.sel) < Math.abs(best - state.sel) ? v : best; }, state.presets[0]);
      saveSel();
    }
  }

  /* ---------- status ---------- */
  function setStatus(key, kind) {
    statusKey = key; statusKind = kind || '';
    var el = $('#status');
    el.textContent = t(key);
    el.className = 'status' + (kind === 'warn' ? ' warn' : '');
  }
  function savedKey() { return mode === 'db' ? 'statusSavedDb' : 'statusSavedLocal'; }

  /* ---------- storage ---------- */
  function localBackend() {
    var K = 'water-log-v1';
    try {
      var d = JSON.parse(localStorage.getItem(K)) || {};
      state.days = d.days || {};
      mergeSettings(d);
    } catch (e) {}
    var persist = function () {
      try { localStorage.setItem(K, JSON.stringify({ goal: state.goal, lang: state.lang, presets: state.presets, days: state.days })); } catch (e) {}
      return Promise.resolve();
    };
    return { saveDay: persist, saveSettings: persist, deleteDay: persist };
  }

  var inflight = 0, latest = null, loadTimer = null;
  function track(p) {
    inflight++;
    return p.finally(function () {
      inflight--;
      if (inflight === 0 && latest) applySnapshot(latest);
    });
  }

  function applySnapshot(snap) {
    latest = snap;
    if (inflight > 0) return;
    var days = {};
    snap.docs.forEach(function (d) {
      var data = d.data() || {};
      if (d.id === 'settings') {
        mergeSettings(data);
      } else if (d.id.indexOf('d-') === 0) {
        var list = Array.isArray(data.entries) ? data.entries : [];
        var entries = list.filter(function (x) { return x && typeof x.ml === 'number' && x.ml !== 0; })
          .map(function (x) { return { id: String(x.id), t: Number(x.t) || 0, ml: x.ml }; });
        if (entries.length) days[d.id.slice(2)] = { entries: entries };
      }
    });
    state.days = days;
    state.loaded = true;
    if (!snap.metadata.fromCache) { clearTimeout(loadTimer); setStatus(savedKey()); }
    applyLang();
    pruneOld();
    render();
  }

  async function dbBackend() {
    if (!window.claude || !window.claude.use) return null;
    var db = await window.claude.use('db');
    var user = await window.claude.use('user');
    if (!db || !user) return null;
    var uid = await user.id();
    if (!uid) return null;
    var col = db.collection('data/users/' + uid);
    var chains = {};
    var queue = function (k, fn) {
      chains[k] = (chains[k] || Promise.resolve()).catch(function () {}).then(fn);
      return chains[k];
    };
    return {
      subscribe: function (onErr) { return col.onSnapshot(applySnapshot, onErr); },
      saveDay: function (key) {
        return track(queue('d-' + key, function () {
          var day = state.days[key];
          var entries = day ? day.entries.slice() : [];
          var ref = col.doc('d-' + key);
          if (!entries.length) return ref.delete();
          return ref.set({ date: key, entries: entries, total: entries.reduce(function (a, e) { return a + e.ml; }, 0) });
        }));
      },
      deleteDay: function (key) { return track(queue('d-' + key, function () { return col.doc('d-' + key).delete(); })); },
      saveSettings: function () { return track(queue('settings', function () { return col.doc('settings').set(settingsObj()); })); }
    };
  }

  function persistDay(key) {
    setStatus('statusSaving');
    Promise.resolve(backend.saveDay(key)).then(function () { setStatus(savedKey()); },
      function () { setStatus('statusErr', 'warn'); });
  }
  var settingsTimer = null;
  function persistSettingsSoon() {
    clearTimeout(settingsTimer);
    settingsTimer = setTimeout(function () {
      setStatus('statusSaving');
      Promise.resolve(backend.saveSettings()).then(function () { setStatus(savedKey()); },
        function () { setStatus('statusErr', 'warn'); });
    }, 400);
  }

  /* keep only the last KEEP_DAYS days (today + 20 before) */
  var pruning = {};
  function pruneOld() {
    if (!state.loaded || !backend) return;
    var cutoff = keyOf(addDays(todayKey(), -(KEEP_DAYS - 1)));
    Object.keys(state.days).forEach(function (k) {
      if (k < cutoff) {
        delete state.days[k];
        if (!pruning[k]) {
          pruning[k] = true;
          Promise.resolve(backend.deleteDay(k)).catch(function () { delete pruning[k]; });
        }
      }
    });
  }

  /* ---------- note (undo / errors) ---------- */
  var noteTimer = null, noteId = null, noteKey = null;
  function clearNote() {
    clearTimeout(noteTimer); noteId = null;
    $('#note').className = 'note';
    $('#noteText').textContent = '';
    $('#undo').hidden = true;
  }
  function showNote(text, id, isErr) {
    clearTimeout(noteTimer);
    $('#note').className = 'note ' + (isErr ? 'err' : 'on');
    $('#noteText').textContent = text;
    noteId = isErr ? null : id;
    noteKey = todayKey();
    $('#undo').hidden = isErr;
    noteTimer = setTimeout(clearNote, isErr ? 4000 : 5000);
  }

  /* ---------- logging ---------- */
  function validSel() { return state.sel >= 10 && state.sel <= 2000; }

  function logAmount(sign) {
    var ml = Math.round(state.sel);
    if (!(ml >= 10 && ml <= 2000)) { showNote(t('badAmount'), null, true); return; }
    var k = todayKey();
    if (sign < 0 && totalOf(k) < ml) { showNote(t('cantRemove'), null, true); return; }
    var day = state.days[k] || (state.days[k] = { entries: [] });
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    day.entries.push({ id: id, t: Date.now(), ml: sign * ml });
    render();
    persistDay(k);
    showNote(t(sign > 0 ? 'added' : 'removed', { n: fmt(ml) }), id, false);
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
  }

  function removeEntry(key, id) {
    var day = state.days[key];
    if (!day) return;
    day.entries = day.entries.filter(function (e) { return e.id !== id; });
    if (!day.entries.length) delete state.days[key];
    render();
    persistDay(key);
  }

  function setGoal(v) {
    v = Math.round(v / 50) * 50;
    if (!isFinite(v)) return;
    state.goal = Math.min(6000, Math.max(500, v));
    render();
    persistSettingsSoon();
  }

  /* ---------- presets ---------- */
  function presetMsg(key) { $('#presetMsg').textContent = key ? t(key) : ''; }
  function addPreset(v) {
    v = Math.round(v);
    if (!(v >= 10 && v <= 2000)) { presetMsg('presetBad'); return false; }
    if (state.presets.indexOf(v) >= 0) { presetMsg('presetDup'); return false; }
    if (state.presets.length >= MAX_PRESETS) { presetMsg('presetMax'); return false; }
    presetMsg('');
    state.presets = normPresets(state.presets.concat([v]));
    ensureSel(); render(); persistSettingsSoon();
    return true;
  }
  function removePreset(v) {
    state.presets = state.presets.filter(function (x) { return x !== v; });
    presetMsg('');
    ensureSel(); render(); persistSettingsSoon();
  }

  /* ---------- language ---------- */
  function applyLang() {
    document.documentElement.lang = state.lang;
    $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    $$('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
    $$('[data-i18n-ph]').forEach(function (el) { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
    $('#undo').textContent = t('undo');
    $('#chart').setAttribute('aria-label', t('chartAria'));
    $('#hrChart').setAttribute('aria-label', t('hourAria'));
    $('#keepNote').textContent = t('keepNote');
    setStatus(statusKey, statusKind);
  }

  /* ---------- render: main ---------- */
  var chipsSig = '';
  function renderControls() {
    var sig = state.presets.join(',');
    var box = $('#chips');
    if (sig !== chipsSig) {
      chipsSig = sig;
      box.textContent = '';
      state.presets.forEach(function (ml) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'chip'; b.setAttribute('data-ml', ml);
        b.innerHTML = '<span class="v"></span><span class="n"></span>';
        b.querySelector('.v').textContent = ml;
        b.addEventListener('click', function () { state.sel = ml; state.custom = false; saveSel(); render(); });
        box.appendChild(b);
      });
      var o = document.createElement('button');
      o.type = 'button'; o.className = 'chip'; o.setAttribute('data-k', 'other');
      o.innerHTML = '<span class="v">…</span><span class="n"></span>';
      o.addEventListener('click', function () {
        state.custom = true;
        if (!validSel()) state.sel = 250;
        saveSel(); render();
        var ci = $('#custom'); ci.focus(); try { ci.select(); } catch (e) {}
      });
      box.appendChild(o);
    }
    $$('#chips .chip').forEach(function (c) {
      var isOther = c.getAttribute('data-k') === 'other';
      c.querySelector('.n').textContent = isOther ? t('other') : t('unit');
      var pressed = isOther ? state.custom : (!state.custom && Number(c.getAttribute('data-ml')) === state.sel);
      c.setAttribute('aria-pressed', pressed ? 'true' : 'false');
    });
    $('#customRow').hidden = !state.custom;
    var ci2 = $('#custom');
    if (document.activeElement !== ci2) ci2.value = state.sel;
    var amt = validSel() ? fmt(state.sel) + ' ' + t('unit') : '–';
    $('#addA').textContent = '+ ' + t('add');
    $('#addM').textContent = amt;
    $('#remA').textContent = '− ' + t('remove');
    $('#remM').textContent = amt;
    $('#unit2').textContent = t('unit');
  }

  function renderHero(total, goal) {
    $('#total').textContent = fmt(total);
    $('#unit1').textContent = t('unit');
    $('#sub').textContent = t('goalLine', { n: fmt(goal) });
    var pill = $('#pill');
    if (total >= goal) {
      pill.className = 'pill done';
      pill.textContent = total > goal ? t('over', { n: fmt(total - goal) }) : t('reached');
    } else {
      pill.className = 'pill';
      pill.textContent = t('toGo', { n: fmt(goal - total) });
    }
    $('#moreLink').textContent = t('details') + ' ›';
    $('#hero').setAttribute('aria-label', t('detailsAria') + ': ' + fmt(total) + ' / ' + fmt(goal) + ' ' + t('unit'));
    var pct = Math.min(total / goal, 1);
    $('#level').style.transform = 'translateY(' + (pct === 0 ? 262 : 248 - 238 * pct) + 'px)';
  }

  /* ---------- render: details ---------- */
  function niceMax(v) {
    if (v <= 0) return 250;
    var steps = [100, 200, 250, 300, 400, 500, 600, 800, 1000, 1500, 2000];
    for (var i = 0; i < steps.length; i++) if (v <= steps[i]) return steps[i];
    return Math.ceil(v / 500) * 500;
  }
  function maxOffset() { return view.mode === 'day' ? KEEP_DAYS - 1 : 2; }

  function renderNav() {
    var main, sub = '';
    if (view.mode === 'day') {
      var d = addDays(todayKey(), -view.offset);
      var full = fmtDate(d, { weekday: 'long', month: 'long', day: 'numeric' });
      if (view.offset === 0) { main = t('today'); sub = full; }
      else if (view.offset === 1) { main = t('yesterday'); sub = full; }
      else main = full;
    } else {
      var s = addDays(todayKey(), -(view.offset * 7 + 6)), e = addDays(todayKey(), -(view.offset * 7));
      var o = { month: 'short', day: 'numeric' };
      main = fmtDate(s, o) + ' – ' + fmtDate(e, o);
      sub = view.offset === 0 ? t('thisWeek') : view.offset === 1 ? t('lastWeek') : t('weeksAgo', { n: view.offset });
    }
    $('#navMain').textContent = main;
    $('#navSub').textContent = sub;
    $('#navPrev').disabled = view.offset >= maxOffset();
    $('#navNext').disabled = view.offset <= 0;
    $$('[data-vm]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-vm') === view.mode ? 'true' : 'false'); });
    $('#dayView').hidden = view.mode !== 'day';
    $('#weekView').hidden = view.mode !== 'week';
  }

  function renderDay() {
    var key = dayKeyAt(view.offset), total = totalOf(key), goal = state.goal;
    $('#dSum').innerHTML = fmt(total) + ' / ' + fmt(goal) + ' <small>' + t('unit') + ' · ' + Math.round(total / goal * 100) + '%</small>';

    var hrs = hourly(key), mx = Math.max.apply(null, hrs), nice = niceMax(mx);
    var x0 = 38, pw = 322, base = 140, top = 14, H = base - top, slot = pw / 24, bw = Math.min(10, slot - 4);
    var s = '';
    [0, 0.5, 1].forEach(function (f) {
      var y = base - H * f;
      s += '<line class="' + (f === 0 ? 'base' : 'gridl') + '" x1="' + x0 + '" x2="360" y1="' + y + '" y2="' + y + '"/>';
      if (f > 0) s += '<text class="axis" x="' + (x0 - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + fmt(nice * f) + '</text>';
    });
    hrs.forEach(function (v, h) {
      if (v <= 0) return;
      var hh = Math.max(3, v / nice * H), x = x0 + h * slot + (slot - bw) / 2;
      var cls = 'bar' + ((view.hour === null || view.hour === h) ? ' met' : '');
      s += '<rect class="' + cls + '" x="' + x + '" y="' + (base - hh) + '" width="' + bw + '" height="' + hh + '" rx="3"/>';
    });
    if (view.hour !== null) s += '<rect class="selmark" x="' + (x0 + view.hour * slot + 1) + '" y="' + (base + 3) + '" width="' + (slot - 2) + '" height="3" rx="1.5"/>';
    [0, 6, 12, 18].forEach(function (h) {
      s += '<text class="axis" x="' + (x0 + h * slot + slot / 2) + '" y="162" text-anchor="middle">' + hourLabel(h) + '</text>';
    });
    for (var h2 = 0; h2 < 24; h2++) {
      s += '<rect class="hit" data-h="' + h2 + '" x="' + (x0 + h2 * slot) + '" y="0" width="' + slot + '" height="' + (base + 8) + '" fill="#000" fill-opacity="0"/>';
    }
    $('#hrChart').innerHTML = s;

    var rd;
    if (view.hour !== null) rd = hourRange(view.hour) + ' · ' + fmt(hrs[view.hour]) + ' ' + t('unit');
    else if (mx > 0) rd = t('peak') + ': ' + hourRange(hrs.indexOf(mx)) + ' · ' + fmt(mx) + ' ' + t('unit');
    else rd = t('noDrinks');
    $('#hrRead').textContent = rd;

    var ul = $('#log');
    ul.textContent = '';
    var day = state.days[key];
    if (!day || !day.entries.length) {
      var p = document.createElement('li');
      p.className = 'empty'; p.style.display = 'block';
      p.textContent = t('none');
      ul.appendChild(p);
    } else {
      day.entries.slice().sort(function (a, b) { return b.t - a.t; }).forEach(function (e) {
        var li = document.createElement('li');
        var tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = fmtTime(e.t);
        var am = document.createElement('span'); am.className = 'am' + (e.ml < 0 ? ' neg' : '');
        am.textContent = (e.ml > 0 ? '+' : '−') + fmt(Math.abs(e.ml)) + ' ' + t('unit');
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'rm'; b.setAttribute('data-live', '');
        b.setAttribute('aria-label', t('delEntry')); b.textContent = '×';
        b.disabled = !state.loaded;
        b.addEventListener('click', function () { removeEntry(key, e.id); });
        li.appendChild(tm); li.appendChild(am); li.appendChild(b);
        ul.appendChild(li);
      });
    }
  }

  function renderWeek() {
    var goal = state.goal, keys = [], offs = [];
    for (var i = 6; i >= 0; i--) { var off = view.offset * 7 + i; offs.push(off); keys.push(dayKeyAt(off)); }
    var totals = keys.map(totalOf);
    var max = Math.max.apply(null, [goal].concat(totals)) * 1.12;
    var W = 360, base = 150, top = 26, H = base - top, slot = W / 7, bw = 30;
    var s = '<line class="base" x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '"/>';
    var gy = base - goal / max * H;
    s += '<line class="goal-line" x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '"/>';
    keys.forEach(function (k, i) {
      var tot = totals[i], met = tot >= goal;
      var h = tot > 0 ? Math.max(3, tot / max * H) : 0;
      var x = i * slot + (slot - bw) / 2, cx = i * slot + slot / 2;
      if (h > 0) s += '<rect class="bar' + (met ? ' met' : '') + '" x="' + x + '" y="' + (base - h) + '" width="' + bw + '" height="' + h + '" rx="5"/>';
      s += '<text class="c-val' + (met ? ' met' : '') + '" x="' + cx + '" y="' + (base - h - 6) + '">' + (tot > 0 ? fmt(tot) : '–') + '</text>';
      var d = addDays(k, 0), isNow = offs[i] === 0;
      s += '<text class="c-day' + (isNow ? ' now' : '') + '" x="' + cx + '" y="170">' + fmtDate(d, { weekday: 'short' }) + '</text>';
      s += '<text class="c-day' + (isNow ? ' now' : '') + '" x="' + cx + '" y="185">' + d.getDate() + '</text>';
      s += '<rect class="hit" data-off="' + offs[i] + '" x="' + (i * slot) + '" y="0" width="' + slot + '" height="192" fill="#000" fill-opacity="0"/>';
    });
    $('#chart').innerHTML = s;
    $('#lgMet').textContent = t('legendMet');
    $('#lgBelow').textContent = t('legendBelow');
    $('#lgGoal').textContent = t('legendGoal', { n: fmt(goal) });

    var logged = totals.filter(function (v) { return v > 0; });
    var sum = totals.reduce(function (a, b) { return a + b; }, 0);
    var avg = logged.length ? sum / logged.length : 0;
    var best = Math.max.apply(null, totals);
    $('#wLbl').textContent = t('avgLbl');
    $('#wSum').innerHTML = (avg ? fmt(avg) : '–') + ' <small>' + t('unit') + '</small>';
    $('#kMet').textContent = t('sMet');
    $('#kTotal').textContent = t('sTotal');
    $('#kBest').textContent = t('sBest');
    $('#sMet').textContent = t('sMetVal', { n: totals.filter(function (v) { return v >= goal; }).length });
    $('#sTotal').textContent = fmt(sum) + ' ' + t('unit');
    $('#sBest').textContent = best > 0 ? fmt(best) + ' ' + t('unit') : '–';
  }

  function renderDetails() {
    if (view.offset > maxOffset()) view.offset = maxOffset();
    renderNav();
    if (view.mode === 'day') renderDay(); else renderWeek();
  }

  /* ---------- render: settings ---------- */
  function renderPrefs() {
    var gi = $('#goal');
    if (document.activeElement !== gi) gi.value = state.goal;
    $('#goalUnit').textContent = t('goalUnit');
    $$('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === state.lang ? 'true' : 'false'); });

    $('#presetsHint').textContent = t('presetsHint', { n: state.presets.length });
    var pl = $('#plist');
    pl.textContent = '';
    state.presets.forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pchip'; b.setAttribute('data-live', '');
      b.setAttribute('aria-label', t('removePreset', { n: fmt(v) }));
      b.innerHTML = '<span></span><i aria-hidden="true">×</i>';
      b.firstChild.textContent = fmt(v) + ' ' + t('unit');
      b.addEventListener('click', function () { removePreset(v); });
      pl.appendChild(b);
    });

  }

  function render() {
    renderedKey = todayKey();
    var total = totalOf(renderedKey), goal = state.goal;
    renderHero(total, goal);
    renderControls();
    renderDetails();
    renderPrefs();
    $$('[data-live]').forEach(function (el) { el.disabled = !state.loaded; });
  }

  /* ---------- panels (hash: #details, #prefs) ---------- */
  var panels = { details: $('#pDetails'), prefs: $('#pPrefs') };
  var current = null, opener = null, navDepth = 0;
  function showPanel(name) {
    current = name;
    Object.keys(panels).forEach(function (k) { panels[k].hidden = (k !== name); });
    document.body.style.overflow = name ? 'hidden' : '';
    if (name) {
      if (name === 'details') { view = { mode: 'day', offset: 0, hour: null }; renderDetails(); }
      panels[name].scrollTop = 0;
      var b = panels[name].querySelector('.back');
      if (b) b.focus({ preventScroll: true });
    } else if (opener) {
      try { opener.focus({ preventScroll: true }); } catch (e) {}
    }
  }
  function openPanel(name, el) {
    opener = el || null;
    if (location.hash === '#' + name) { showPanel(name); return; }
    navDepth = 1;
    location.hash = name;
  }
  function closePanel() {
    if (navDepth) { navDepth = 0; history.back(); return; }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    showPanel(null);
  }
  window.addEventListener('hashchange', function () {
    var h = location.hash.slice(1);
    showPanel(panels[h] ? h : null);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && current) closePanel(); });

  /* ---------- events ---------- */
  $('#hero').addEventListener('click', function () { openPanel('details', $('#hero')); });
  $('#openPrefs').addEventListener('click', function () { openPanel('prefs', $('#openPrefs')); });
  $$('[data-back]').forEach(function (b) { b.addEventListener('click', closePanel); });

  $('#add').addEventListener('click', function () { logAmount(1); });
  $('#rem').addEventListener('click', function () { logAmount(-1); });
  $('#undo').addEventListener('click', function () { var id = noteId, k = noteKey; clearNote(); if (id) removeEntry(k, id); });

  $('#custom').addEventListener('input', function (e) {
    var v = Math.round(Number(e.target.value));
    state.sel = isFinite(v) && v > 0 ? v : 0;
    saveSel();
    renderControls();
  });
  function stepCustom(d) {
    var v = validSel() ? state.sel : 250;
    state.sel = Math.min(2000, Math.max(10, Math.round((v + d) / 10) * 10));
    saveSel(); render();
  }
  $('#cDown').addEventListener('click', function () { stepCustom(-50); });
  $('#cUp').addEventListener('click', function () { stepCustom(50); });

  $$('[data-vm]').forEach(function (b) {
    b.addEventListener('click', function () { view.mode = b.getAttribute('data-vm'); view.offset = 0; view.hour = null; renderDetails(); });
  });
  $('#navPrev').addEventListener('click', function () { if (view.offset < maxOffset()) { view.offset++; view.hour = null; renderDetails(); } });
  $('#navNext').addEventListener('click', function () { if (view.offset > 0) { view.offset--; view.hour = null; renderDetails(); } });
  $('#hrChart').addEventListener('click', function (e) {
    var h = e.target.getAttribute && e.target.getAttribute('data-h');
    if (h == null) return;
    h = Number(h);
    view.hour = view.hour === h ? null : h;
    renderDetails();
  });
  $('#chart').addEventListener('click', function (e) {
    var o = e.target.getAttribute && e.target.getAttribute('data-off');
    if (o == null) return;
    view = { mode: 'day', offset: Number(o), hour: null };
    renderDetails();
  });

  $('#goal').addEventListener('change', function (e) { setGoal(Number(e.target.value)); });
  $('#gDown').addEventListener('click', function () { setGoal(state.goal - 100); });
  $('#gUp').addEventListener('click', function () { setGoal(state.goal + 100); });

  $('#presetAdd').addEventListener('click', function () {
    var inp = $('#presetNew');
    if (inp.value === '') { presetMsg('presetBad'); return; }
    if (addPreset(Number(inp.value))) inp.value = '';
  });
  $('#presetNew').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('#presetAdd').click(); } });
  $('#presetReset').addEventListener('click', function () {
    state.presets = DEFAULT_PRESETS.slice(); presetMsg('');
    ensureSel(); render(); persistSettingsSoon();
  });

  $$('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.lang = b.getAttribute('data-lang');
      applyLang(); render(); persistSettingsSoon();
    });
  });

  function tick() {
    if (todayKey() !== renderedKey) { pruneOld(); render(); }
  }
  setInterval(tick, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });

  /* ---------- start ---------- */
  applyLang();
  render();
  var h0 = location.hash.slice(1);
  if (panels[h0]) showPanel(h0);
  (async function () {
    var b = null;
    try { b = await dbBackend(); } catch (e) { b = null; }
    if (!b) {
      mode = 'local';
      backend = localBackend();
      state.loaded = true;
      setStatus(savedKey());
      applyLang(); pruneOld(); render();
      return;
    }
    mode = 'db';
    backend = b;
    loadTimer = setTimeout(function () { setStatus(state.loaded ? 'statusStale' : 'statusUnreach', 'warn'); }, 10000);
    b.subscribe(function () { setStatus('statusUnavail', 'warn'); });
  })();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
