<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#0B7C89">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Water Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Water Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* Layout: one column on phones. From 820px the glass and the add buttons sit left; today's drinks and the 7-day chart sit right. */
:root {
  --bg: #EEF4F5;
  --surface: #FFFFFF;
  --fg: #0F2429;
  --muted: #587076;
  --line: #D6E3E6;
  --accent: #0B7C89;
  --accent-ink: #FFFFFF;
  --water: #4DBBCB;
  --water-back: #9ADAE4;
  --bar: #BFE3EA;
  --bar-met: #0B7C89;
  --glass-fill: #F7FBFC;
  --glass-line: #9DB9BF;
  --danger: #B3261E;
  --font-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'DM Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A171B;
    --surface: #112429;
    --fg: #E4F1F3;
    --muted: #8CA8AE;
    --line: #223E45;
    --accent: #4CC2D1;
    --accent-ink: #06242A;
    --water: #2BA6BA;
    --water-back: #1B6C7B;
    --bar: #1F4650;
    --bar-met: #4CC2D1;
    --glass-fill: #0D1E23;
    --glass-line: #3C6670;
    --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A171B;
  --surface: #112429;
  --fg: #E4F1F3;
  --muted: #8CA8AE;
  --line: #223E45;
  --accent: #4CC2D1;
  --accent-ink: #06242A;
  --water: #2BA6BA;
  --water-back: #1B6C7B;
  --bar: #1F4650;
  --bar-met: #4CC2D1;
  --glass-fill: #0D1E23;
  --glass-line: #3C6670;
  --danger: #FF8A80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.5 var(--font-body);
  font-variant-numeric: tabular-nums;
  padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
button, input { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 940px; margin: 0 auto; display: grid; gap: 24px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 16px; }
h1 { font: 700 30px/1.1 var(--font-display); letter-spacing: -0.01em; }
.date { color: var(--muted); margin-top: 4px; }
.status { color: var(--muted); font-size: 13px; }
.status.warn { color: var(--danger); }

.cols { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
.col { display: grid; gap: 28px; align-content: start; min-width: 0; }
@media (min-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

.label { font: 600 12px/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

/* Hero */
.hero {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 20px; display: grid; grid-template-columns: clamp(132px, 38vw, 168px) minmax(0, 1fr); gap: 16px 20px; align-items: center;
}
.glass { width: 100%; height: auto; display: block; }
.g-fill { fill: var(--glass-fill); }
.g-line { stroke: var(--glass-line); stroke-width: 2.5; stroke-linejoin: round; }
.water { fill: var(--water); }
.water-back { fill: var(--water-back); }
.level { transition: transform 0.9s cubic-bezier(0.3, 0.7, 0.2, 1); }
.wave { animation: drift 5s linear infinite; }
.wave.back { animation-duration: 8s; animation-direction: reverse; }
@keyframes drift { to { transform: translateX(-120px); } }
.tick { font: 500 15px var(--font-body); fill: var(--muted); }
.tick.goal { fill: var(--fg); font-weight: 600; }
.tick-line { stroke: var(--glass-line); stroke-width: 1.5; }

.big { font: 700 clamp(40px, 11vw, 56px)/1 var(--font-display); letter-spacing: -0.02em; }
.big .unit { font: 500 18px var(--font-body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.sub { color: var(--muted); margin-top: 6px; }
.pill { display: inline-block; margin-top: 12px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); font-weight: 500; font-size: 14px; }
.pill.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.goal { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.goal label { font-weight: 500; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { width: 44px; height: 44px; border: 0; background: transparent; font-size: 20px; cursor: pointer; }
.stepper button:hover:not(:disabled) { background: var(--bg); }
.stepper input { width: 76px; height: 44px; font-size: 16px; border: 0; border-inline: 1px solid var(--line); background: transparent; text-align: center; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.goal .u { color: var(--muted); }

/* Quick add */
.qa { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 8px; }
.qbtn {
  display: grid; gap: 2px; justify-items: center; padding: 12px 6px; min-height: 68px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
}
.qbtn:hover:not(:disabled) { border-color: var(--accent); }
.qbtn:active:not(:disabled) { transform: scale(0.97); }
.qbtn .n { font-size: 13px; color: var(--muted); }
.qbtn .v { font: 700 20px/1.1 var(--font-display); }
.qbtn .v small { font: 500 12px var(--font-body); color: var(--muted); margin-left: 2px; }
.custom { display: flex; gap: 8px; margin-top: 10px; }
.field { position: relative; flex: 1; min-width: 0; }
.field input { width: 100%; height: 48px; font-size: 16px; padding: 0 40px 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.field .u { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.btn { height: 48px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.hint { margin-top: 6px; font-size: 13px; color: var(--danger); }
.hint:empty { display: none; }
button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }

/* Today's drinks */
.log li { display: flex; align-items: center; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.log li:first-child { border-top: 1px solid var(--line); }
.log .t { color: var(--muted); width: 56px; }
.log .a { font-weight: 600; flex: 1; }
.log .rm { width: 44px; height: 44px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
.log .rm:hover:not(:disabled) { background: var(--bg); color: var(--danger); }
.empty { color: var(--muted); padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

/* Week */
.week { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.week .label { margin-bottom: 8px; }
.chart { display: block; width: 100%; height: auto; }
.bar { fill: var(--bar); }
.bar.met { fill: var(--bar-met); }
.base { stroke: var(--line); stroke-width: 1; }
.goal-line { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; }
.c-val { font: 600 12px var(--font-body); fill: var(--muted); text-anchor: middle; }
.c-val.met { fill: var(--fg); }
.c-day { font: 500 12px var(--font-body); fill: var(--muted); text-anchor: middle; }
.c-day.now { fill: var(--fg); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--bar-met); }
.sw.dash { background: none; height: 0; width: 18px; border-top: 1.5px dashed var(--muted); border-radius: 0; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.stats3 .k { font-size: 12px; color: var(--muted); }
.stats3 .v { font: 700 20px/1.2 var(--font-display); margin-top: 2px; }
.stats3 .v small { font: 500 12px var(--font-body); color: var(--muted); }

/* Undo toast + "Other" button (the button only shows on phones) */
.toast { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; padding: 4px 4px 4px 14px; border-radius: 12px; background: var(--fg); color: var(--bg); font-weight: 500; }
.toast button { min-height: 44px; padding: 0 14px; border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
.more { display: none; }

/* Phones: logging bar pinned to the bottom, within thumb reach */
@media (max-width: 819px) {
  body { padding-block: 16px calc(112px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size: 26px; }
  .app, .cols, .col { gap: 22px; }
  .hero { padding: 16px; gap: 12px 16px; }
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-top: 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .dock .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0; }
  .qa { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .qbtn { min-height: 58px; padding: 8px 2px; }
  .qbtn .v { font-size: 18px; }
  .qbtn .v small { display: none; }
  .qbtn.more { display: grid; }
  .custom { display: none; }
  .dock.open .custom { display: flex; }
  .toast {
    position: absolute; bottom: calc(100% + 10px); margin: 0; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<main class="app">
  <header class="top">
    <div>
      <h1>Water Log</h1>
      <p class="date" id="date"></p>
    </div>
    <p class="status" id="status" role="status">Loading your log…</p>
  </header>

  <div class="cols">
    <div class="col">
      <section class="hero" aria-labelledby="h-today">
        <h2 class="sr" id="h-today">Today's total</h2>
        <svg class="glass" id="glass" viewBox="0 0 196 262" role="img" aria-label="0 of 2,000 ml">
          <defs>
            <clipPath id="gclip"><path d="M8 10 L128 10 L116 236 Q115 248 103 248 L33 248 Q21 248 20 236 Z"/></clipPath>
          </defs>
          <path class="g-fill" d="M8 10 L128 10 L116 236 Q115 248 103 248 L33 248 Q21 248 20 236 Z"/>
          <g clip-path="url(#gclip)">
            <g class="level" id="level" style="transform: translateY(260px)">
              <g class="wave back"><path class="water-back" d="M0 6 Q30 12 60 6 T120 6 T180 6 T240 6 T300 6 T360 6 T420 6 T480 6 V320 H0 Z"/></g>
              <g class="wave"><path class="water" d="M0 4 Q30 -2 60 4 T120 4 T180 4 T240 4 T300 4 T360 4 T420 4 T480 4 V320 H0 Z"/></g>
            </g>
          </g>
          <path class="g-line" fill="none" d="M8 10 L128 10 L116 236 Q115 248 103 248 L33 248 Q21 248 20 236 Z"/>
          <g id="ticks"></g>
        </svg>
        <div>
          <p class="big"><span id="total">0</span><span class="unit">ml</span></p>
          <p class="sub" id="sub">of 2,000 ml today</p>
          <p class="pill" id="pill">2,000 ml to go</p>
          <div class="goal">
            <label for="goal">Daily goal</label>
            <div class="stepper">
              <button type="button" id="gDown" aria-label="Lower goal by 100 ml" data-live>−</button>
              <input id="goal" type="number" inputmode="numeric" min="500" max="6000" step="100" value="2000" data-live>
              <button type="button" id="gUp" aria-label="Raise goal by 100 ml" data-live>+</button>
            </div>
            <span class="u">ml</span>
          </div>
        </div>
      </section>

      <section class="dock" id="dock" aria-labelledby="h-add">
        <div class="toast" id="toast" hidden role="status"><span id="toastText"></span><button type="button" id="undo">Undo</button></div>
        <h2 class="label" id="h-add">Log a drink</h2>
        <div class="qa">
          <button type="button" class="qbtn" data-ml="100" data-live><span class="n">Sip</span><span class="v">100<small>ml</small></span></button>
          <button type="button" class="qbtn" data-ml="250" data-live><span class="n">Glass</span><span class="v">250<small>ml</small></span></button>
          <button type="button" class="qbtn" data-ml="350" data-live><span class="n">Mug</span><span class="v">350<small>ml</small></span></button>
          <button type="button" class="qbtn" data-ml="500" data-live><span class="n">Bottle</span><span class="v">500<small>ml</small></span></button>
          <button type="button" class="qbtn more" id="more" aria-expanded="false" aria-controls="customForm" data-live><span class="n">Other</span><span class="v">+</span></button>
        </div>
        <form class="custom" id="customForm">
          <div class="field">
            <label class="sr" for="custom">Custom amount in millilitres</label>
            <input id="custom" type="number" inputmode="numeric" min="10" max="2000" step="10" placeholder="Other amount" data-live>
            <span class="u">ml</span>
          </div>
          <button class="btn" type="submit" data-live>Add</button>
        </form>
        <p class="hint" id="hint" role="status"></p>
      </section>
    </div>

    <div class="col">
      <section aria-labelledby="h-log">
        <h2 class="label" id="h-log">Today's drinks</h2>
        <ul class="log" id="log"></ul>
      </section>

      <section class="week" aria-labelledby="h-week">
        <h2 class="label" id="h-week">Last 7 days</h2>
        <svg class="chart" id="chart" viewBox="0 0 360 192" role="img" aria-label="Daily water intake for the last 7 days"></svg>
        <div class="legend">
          <span><i class="sw"></i>Goal reached</span>
          <span><i class="sw" style="background: var(--bar)"></i>Below goal</span>
          <span><i class="sw dash"></i><b id="goalLegend" style="font-weight: 500">Goal 2,000 ml</b></span>
        </div>
        <div class="stats3">
          <div><p class="k">Goal reached</p><p class="v" id="sMet">0 <small>of 7 days</small></p></div>
          <div><p class="k">Average</p><p class="v" id="sAvg">– </p></div>
          <div><p class="k">Streak</p><p class="v" id="sStreak">0 <small>days</small></p></div>
        </div>
      </section>
    </div>
  </div>
</main>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var fmt = function (n) { return Math.round(n).toLocaleString(); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var keyOf = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var addDays = function (key, n) { var p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] + n, 12); };
  var todayKey = function () { return keyOf(new Date()); };

  var state = { goal: 2000, days: {}, loaded: false };
  var backend = null;
  var mode = 'pending';
  var renderedKey = todayKey();

  function totalOf(key) {
    var d = state.days[key];
    return d ? d.entries.reduce(function (a, e) { return a + e.ml; }, 0) : 0;
  }

  function setStatus(text, kind) {
    var el = $('#status');
    el.textContent = text;
    el.className = 'status' + (kind === 'warn' ? ' warn' : '');
  }
  function savedText() { return mode === 'db' ? 'Saved to your account' : 'Saved on this device only'; }

  /* ---------- storage ---------- */
  function localBackend() {
    var K = 'water-log-v1';
    try {
      var d = JSON.parse(localStorage.getItem(K)) || {};
      state.goal = d.goal || 2000;
      state.days = d.days || {};
    } catch (e) {}
    var persist = function () {
      try { localStorage.setItem(K, JSON.stringify({ goal: state.goal, days: state.days })); } catch (e) {}
      return Promise.resolve();
    };
    return { saveDay: persist, saveGoal: persist };
  }

  var inflight = 0, latest = null, loadTimer = null;
  function track(p) {
    inflight++;
    return p.finally(function () {
      inflight--;
      if (inflight === 0 && latest) applySnapshot(latest);
    });
  }

  function applySnapshot(snap) {
    latest = snap;
    if (inflight > 0) return;
    var days = {}, goal = state.goal;
    snap.docs.forEach(function (d) {
      var data = d.data() || {};
      if (d.id === 'settings') {
        if (typeof data.goal === 'number') goal = data.goal;
      } else if (d.id.indexOf('d-') === 0) {
        var list = Array.isArray(data.entries) ? data.entries : [];
        var entries = list.filter(function (x) { return x && typeof x.ml === 'number'; })
          .map(function (x) { return { id: String(x.id), t: Number(x.t) || 0, ml: x.ml }; });
        if (entries.length) days[d.id.slice(2)] = { entries: entries };
      }
    });
    state.days = days;
    state.goal = goal;
    state.loaded = true;
    if (!snap.metadata.fromCache) { clearTimeout(loadTimer); setStatus(savedText()); }
    render();
  }

  async function dbBackend() {
    if (!window.claude || !window.claude.use) return null;
    var db = await window.claude.use('db');
    var user = await window.claude.use('user');
    if (!db || !user) return null;
    var uid = await user.id();
    if (!uid) return null;
    var col = db.collection('data/users/' + uid);
    var chains = {};
    var queue = function (k, fn) {
      chains[k] = (chains[k] || Promise.resolve()).catch(function () {}).then(fn);
      return chains[k];
    };
    return {
      subscribe: function (onErr) { return col.onSnapshot(applySnapshot, onErr); },
      saveDay: function (key) {
        return track(queue('d-' + key, function () {
          var day = state.days[key];
          var entries = day ? day.entries.slice() : [];
          var ref = col.doc('d-' + key);
          if (!entries.length) return ref.delete();
          return ref.set({ date: key, entries: entries, total: entries.reduce(function (a, e) { return a + e.ml; }, 0) });
        }));
      },
      saveGoal: function () {
        return track(queue('settings', function () { return col.doc('settings').set({ goal: state.goal }); }));
      }
    };
  }

  function persistDay(key) {
    setStatus('Saving…');
    Promise.resolve(backend.saveDay(key)).then(function () { setStatus(savedText()); },
      function () { setStatus("Couldn't save. Check your connection and try again.", 'warn'); });
  }
  var goalTimer = null;
  function persistGoalSoon() {
    clearTimeout(goalTimer);
    goalTimer = setTimeout(function () {
      setStatus('Saving…');
      Promise.resolve(backend.saveGoal()).then(function () { setStatus(savedText()); },
        function () { setStatus("Couldn't save. Check your connection and try again.", 'warn'); });
    }, 500);
  }

  /* ---------- actions ---------- */
  function hint(msg) { $('#hint').textContent = msg || ''; }

  function addDrink(ml) {
    ml = Math.round(ml);
    if (!(ml >= 10 && ml <= 2000)) { hint('Enter an amount between 10 and 2,000 ml.'); return false; }
    hint('');
    var k = todayKey();
    var day = state.days[k] || (state.days[k] = { entries: [] });
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    day.entries.push({ id: id, t: Date.now(), ml: ml });
    render();
    persistDay(k);
    showToast(ml, id);
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
    return true;
  }

  function removeDrink(id) {
    var k = todayKey();
    var day = state.days[k];
    if (!day) return;
    day.entries = day.entries.filter(function (e) { return e.id !== id; });
    if (!day.entries.length) delete state.days[k];
    render();
    persistDay(k);
  }

  function setGoal(v) {
    v = Math.round(v / 50) * 50;
    if (!isFinite(v)) return;
    v = Math.min(6000, Math.max(500, v));
    state.goal = v;
    render();
    persistGoalSoon();
  }

  /* ---------- render ---------- */
  function renderGlass(total, goal) {
    var pct = Math.min(total / goal, 1);
    var y = 248 - 238 * pct;
    $('#level').style.transform = 'translateY(' + (pct === 0 ? 262 : y) + 'px)';
    $('#glass').setAttribute('aria-label', fmt(total) + ' of ' + fmt(goal) + ' ml');
    var t = '';
    [0.25, 0.5, 0.75, 1].forEach(function (f) {
      var ty = 248 - 238 * f;
      var v = Math.round(goal * f / 50) * 50;
      t += '<line class="tick-line" x1="132" x2="139" y1="' + ty + '" y2="' + ty + '"/>' +
        '<text class="tick' + (f === 1 ? ' goal' : '') + '" x="143" y="' + (ty + 3.5) + '">' + fmt(v) + '</text>';
    });
    $('#ticks').innerHTML = t;
  }

  function renderLog() {
    var k = todayKey();
    var day = state.days[k];
    var ul = $('#log');
    ul.textContent = '';
    if (!day || !day.entries.length) {
      var p = document.createElement('li');
      p.className = 'empty';
      p.textContent = 'Nothing logged yet today. Tap a size above to log your first drink.';
      p.style.display = 'block';
      ul.appendChild(p);
      return;
    }
    day.entries.slice().sort(function (a, b) { return b.t - a.t; }).forEach(function (e) {
      var li = document.createElement('li');
      var t = document.createElement('span');
      t.className = 't';
      t.textContent = new Date(e.t).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      var a = document.createElement('span');
      a.className = 'a';
      a.textContent = fmt(e.ml) + ' ml';
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'rm';
      b.setAttribute('data-live', '');
      b.setAttribute('aria-label', 'Remove ' + fmt(e.ml) + ' ml drink');
      b.textContent = '×';
      b.disabled = !state.loaded;
      b.addEventListener('click', function () { removeDrink(e.id); });
      li.appendChild(t); li.appendChild(a); li.appendChild(b);
      ul.appendChild(li);
    });
  }

  function renderWeek() {
    var t = todayKey(), goal = state.goal;
    var keys = [];
    for (var i = 6; i >= 0; i--) keys.push(keyOf(addDays(t, -i)));
    var totals = keys.map(totalOf);
    var max = Math.max.apply(null, [goal].concat(totals)) * 1.12;
    var W = 360, base = 150, top = 26, H = base - top, slot = W / 7, bw = 30;
    var s = '<line class="base" x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '"/>';
    var gy = base - goal / max * H;
    s += '<line class="goal-line" x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '"/>';
    keys.forEach(function (k, i) {
      var tot = totals[i], met = tot >= goal;
      var h = tot > 0 ? Math.max(3, tot / max * H) : 0;
      var x = i * slot + (slot - bw) / 2, cx = i * slot + slot / 2;
      if (h > 0) s += '<rect class="bar' + (met ? ' met' : '') + '" x="' + x + '" y="' + (base - h) + '" width="' + bw + '" height="' + h + '" rx="5"/>';
      s += '<text class="c-val' + (met ? ' met' : '') + '" x="' + cx + '" y="' + (base - h - 6) + '">' + (tot > 0 ? fmt(tot) : '–') + '</text>';
      var d = addDays(k, 0);
      var isNow = i === 6;
      s += '<text class="c-day' + (isNow ? ' now' : '') + '" x="' + cx + '" y="170">' + (isNow ? 'Today' : d.toLocaleDateString(undefined, { weekday: 'short' })) + '</text>';
      s += '<text class="c-day" x="' + cx + '" y="185">' + d.getDate() + '</text>';
    });
    $('#chart').innerHTML = s;
    $('#goalLegend').textContent = 'Goal ' + fmt(goal) + ' ml';

    var metCount = totals.filter(function (v) { return v >= goal; }).length;
    var logged = totals.filter(function (v) { return v > 0; });
    var avg = logged.length ? logged.reduce(function (a, b) { return a + b; }, 0) / logged.length : 0;
    var k2 = t;
    if (totalOf(k2) < goal) k2 = keyOf(addDays(k2, -1));
    var streak = 0;
    while (totalOf(k2) >= goal && streak < 400) { streak++; k2 = keyOf(addDays(k2, -1)); }
    $('#sMet').innerHTML = metCount + ' <small>of 7 days</small>';
    $('#sAvg').innerHTML = avg ? fmt(avg) + ' <small>ml / day</small>' : '–';
    $('#sStreak').innerHTML = streak + ' <small>' + (streak === 1 ? 'day' : 'days') + '</small>';
  }

  function render() {
    renderedKey = todayKey();
    var total = totalOf(renderedKey), goal = state.goal;
    $('#date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    $('#total').textContent = fmt(total);
    $('#sub').textContent = 'of ' + fmt(goal) + ' ml today';
    var pill = $('#pill');
    if (total >= goal) {
      pill.className = 'pill done';
      pill.textContent = total > goal ? 'Goal reached · ' + fmt(total - goal) + ' ml over' : 'Goal reached';
    } else {
      pill.className = 'pill';
      pill.textContent = fmt(goal - total) + ' ml to go';
    }
    var gi = $('#goal');
    if (document.activeElement !== gi) gi.value = goal;
    renderGlass(total, goal);
    renderLog();
    renderWeek();
    document.querySelectorAll('[data-live]').forEach(function (el) { el.disabled = !state.loaded; });
  }

  var toastTimer = null, toastId = null;
  function hideToast() { clearTimeout(toastTimer); toastId = null; $('#toast').hidden = true; }
  function showToast(ml, id) {
    clearTimeout(toastTimer);
    toastId = id;
    $('#toastText').textContent = fmt(ml) + ' ml added';
    $('#toast').hidden = false;
    toastTimer = setTimeout(hideToast, 5000);
  }
  function setOpen(open) {
    $('#dock').classList.toggle('open', open);
    $('#more').setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) $('#custom').focus();
  }

  /* ---------- events ---------- */
  document.querySelectorAll('.qbtn').forEach(function (b) {
    b.addEventListener('click', function () { addDrink(Number(b.getAttribute('data-ml'))); });
  });
  $('#customForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('#custom');
    if (addDrink(Number(input.value))) { input.value = ''; setOpen(false); }
  });
  $('#goal').addEventListener('change', function (e) { setGoal(Number(e.target.value)); });
  $('#more').addEventListener('click', function () { setOpen(!$('#dock').classList.contains('open')); });
  $('#undo').addEventListener('click', function () { var id = toastId; hideToast(); if (id) removeDrink(id); });
  $('#gDown').addEventListener('click', function () { setGoal(state.goal - 100); });
  $('#gUp').addEventListener('click', function () { setGoal(state.goal + 100); });

  function checkRollover() { if (todayKey() !== renderedKey) render(); }
  setInterval(checkRollover, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkRollover(); });

  /* ---------- start ---------- */
  render();
  (async function () {
    var b = null;
    try { b = await dbBackend(); } catch (e) { b = null; }
    if (!b) {
      mode = 'local';
      backend = localBackend();
      state.loaded = true;
      setStatus(savedText());
      render();
      return;
    }
    mode = 'db';
    backend = b;
    loadTimer = setTimeout(function () {
      if (!state.loaded) setStatus("Can't reach your saved log yet. It will load when the connection returns.", 'warn');
      else setStatus('Your log may be out of date. Reconnecting…', 'warn');
    }, 10000);
    b.subscribe(function () { setStatus('Your saved log is unavailable right now.', 'warn'); });
  })();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
