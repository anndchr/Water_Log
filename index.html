<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#EEF4F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A171B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="УС УУ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>УС УУ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column. Main screen = drop total (tap for details) + amount picker + Add/Remove at thumb height.
   Details and Settings open as full-screen panels (#details, #prefs). */
:root {
  --bg: #EEF4F5;
  --surface: #FFFFFF;
  --fg: #0F2429;
  --muted: #587076;
  --line: #D6E3E6;
  --accent: #0B7C89;
  --accent-ink: #FFFFFF;
  --chip-on: #DDF1F4;
  --water: #4DBBCB;
  --water-back: #9ADAE4;
  --bar: #BFE3EA;
  --bar-met: #0B7C89;
  --glass-fill: #F7FBFC;
  --glass-line: #9DB9BF;
  --danger: #B3261E;
  --font-display: 'Unbounded', 'Manrope', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', system-ui, sans-serif;
  --font-body: 'Manrope', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A171B;
    --surface: #112429;
    --fg: #E4F1F3;
    --muted: #8CA8AE;
    --line: #223E45;
    --accent: #4CC2D1;
    --accent-ink: #06242A;
    --chip-on: #153940;
    --water: #2BA6BA;
    --water-back: #1B6C7B;
    --bar: #1F4650;
    --bar-met: #4CC2D1;
    --glass-fill: #0D1E23;
    --glass-line: #3C6670;
    --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A171B;
  --surface: #112429;
  --fg: #E4F1F3;
  --muted: #8CA8AE;
  --line: #223E45;
  --accent: #4CC2D1;
  --accent-ink: #06242A;
  --chip-on: #153940;
  --water: #2BA6BA;
  --water-back: #1B6C7B;
  --bar: #1F4650;
  --bar-met: #4CC2D1;
  --glass-fill: #0D1E23;
  --glass-line: #3C6670;
  --danger: #FF8A80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 500 16px/1.45 var(--font-body);
  font-variant-numeric: tabular-nums;
  padding-block: 12px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
button, input { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }

/* ---------- main screen ---------- */
.app {
  max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
  min-height: calc(100vh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  min-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
}
.top { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
h1 { display: flex; align-items: center; gap: 10px; font: 700 22px/1 var(--font-display); letter-spacing: 0.02em; }
h1 svg { width: 22px; height: 26px; fill: var(--accent); }
.iconbtn { width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.iconbtn svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.hero {
  display: grid; grid-template-columns: clamp(104px, 30vw, 136px) minmax(0, 1fr); gap: 18px; align-items: center;
  width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
  padding: 18px; cursor: pointer;
}
.hero:hover { border-color: var(--accent); }
.hero .t > * { display: block; }
.glass { width: 100%; height: auto; display: block; }
.g-fill { fill: var(--glass-fill); }
.g-line { stroke: var(--glass-line); stroke-width: 2.5; stroke-linejoin: round; }
.water { fill: var(--water); }
.water-back { fill: var(--water-back); }
.level { transition: transform 0.9s cubic-bezier(0.3, 0.7, 0.2, 1); }
.wave { animation: drift 5s linear infinite; }
.wave.back { animation-duration: 8s; animation-direction: reverse; }
@keyframes drift { to { transform: translateX(-120px); } }

.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.big { font: 800 clamp(40px, 12vw, 54px)/1.05 var(--font-body); letter-spacing: -0.02em; margin-top: 2px; }
.big .unit { font-size: 18px; font-weight: 600; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.pill { display: inline-block !important; margin-top: 10px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.pill.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.more { margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--accent); }

.note { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px 0 16px; border-radius: 14px; font-weight: 600; }
.note.on { background: var(--fg); color: var(--bg); }
.note.err { color: var(--danger); padding-left: 4px; }
.note button { min-height: 44px; padding: 0 16px; border: 0; background: transparent; color: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; }

.controls { margin-top: auto; display: grid; gap: 12px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.chip {
  display: grid; gap: 2px; justify-items: center; align-content: center; min-height: 72px; padding: 8px 2px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.chip .n { font-size: 12px; font-weight: 600; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .v { font-size: 20px; font-weight: 800; line-height: 1.1; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--chip-on); }
.chip[aria-pressed="true"] .n { color: var(--fg); }
.custom { display: grid; grid-template-columns: 60px minmax(0, 1fr) 60px; gap: 8px; align-items: center; }
.sbtn { height: 60px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); font-size: 28px; font-weight: 700; cursor: pointer; }
.sbtn:hover:not(:disabled) { border-color: var(--accent); }
.field { position: relative; }
.field input { width: 100%; height: 60px; padding: 0 48px 0 14px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); font-size: 24px; font-weight: 800; text-align: center; }
.field .u { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }

.acts { display: grid; grid-template-columns: 1fr 1.7fr; gap: 10px; }
.act { display: grid; gap: 2px; justify-items: center; align-content: center; min-height: 76px; border-radius: 18px; cursor: pointer; border: 2px solid var(--accent); transition: transform 0.1s; }
.act:active:not(:disabled) { transform: scale(0.98); }
.act .a { font-size: 19px; font-weight: 800; }
.act .m { font-size: 14px; font-weight: 600; opacity: 0.85; }
.act.add { background: var(--accent); color: var(--accent-ink); }
.act.rem { background: var(--surface); color: var(--fg); }

/* ---------- panels ---------- */
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pwrap { max-width: 520px; margin: 0 auto; padding-block: 12px 40px; display: grid; gap: 26px; }
.phead { display: flex; align-items: center; gap: 8px; min-height: 48px; }
.phead h2 { font: 700 20px/1.2 var(--font-display); }
.back { width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
.back svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sec h3 { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.dsum .d { color: var(--muted); font-size: 14px; }
.dsum .s { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; margin-top: 2px; }
.dsum .s small { font-size: 16px; font-weight: 600; color: var(--muted); }

.log li { display: flex; align-items: center; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.log li:first-child { border-top: 1px solid var(--line); }
.log .tm { color: var(--muted); min-width: 76px; }
.log .am { font-weight: 700; flex: 1; }
.log .am.neg { color: var(--danger); }
.log .rm { width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; }
.log .rm:hover:not(:disabled) { background: var(--surface); color: var(--danger); }
.empty { color: var(--muted); padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

.weekbox { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.chart { display: block; width: 100%; height: auto; }
.bar { fill: var(--bar); }
.bar.met { fill: var(--bar-met); }
.base { stroke: var(--line); stroke-width: 1; }
.goal-line { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 4; }
.c-val { font: 700 12px var(--font-body); fill: var(--muted); text-anchor: middle; }
.c-val.met { fill: var(--fg); }
.c-day { font: 600 12px var(--font-body); fill: var(--muted); text-anchor: middle; }
.c-day.now { fill: var(--fg); font-weight: 800; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; background: var(--bar-met); }
.sw.below { background: var(--bar); }
.sw.dash { background: none; height: 0; width: 18px; border-top: 1.5px dashed var(--muted); border-radius: 0; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.stats3 .k { font-size: 12px; color: var(--muted); }
.stats3 .v { font-size: 18px; font-weight: 800; margin-top: 2px; line-height: 1.25; }

.row { display: grid; gap: 10px; }
.row + .row { padding-top: 22px; border-top: 1px solid var(--line); }
.row .rl { font-weight: 700; }
.row .hintline { color: var(--muted); font-size: 14px; }
.stepper { display: inline-flex; align-items: center; justify-self: start; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.stepper button { width: 56px; height: 56px; border: 0; background: transparent; font-size: 26px; font-weight: 700; cursor: pointer; }
.stepper button:hover:not(:disabled) { background: var(--bg); }
.stepper input { width: 100px; height: 56px; border: 0; border-inline: 1px solid var(--line); background: transparent; text-align: center; font-size: 20px; font-weight: 800; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 52px; padding: 0 8px; border: 0; background: transparent; font-weight: 700; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.status { color: var(--muted); font-size: 14px; }
.status.warn { color: var(--danger); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<main class="app" id="app">
  <header class="top">
    <h1>
      <svg viewBox="0 0 22 26" aria-hidden="true"><path d="M11 1 C11 1 2 11.5 2 17 a9 9 0 0 0 18 0 C20 11.5 11 1 11 1 Z"/></svg>
      УС УУ
    </h1>
    <button type="button" class="iconbtn" id="openPrefs" data-i18n-aria="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <button type="button" class="hero" id="hero">
    <svg class="glass" id="glass" viewBox="0 0 136 262" aria-hidden="true">
      <defs>
        <clipPath id="gclip"><path d="M8 10 L128 10 L116 236 Q115 248 103 248 L33 248 Q21 248 20 236 Z"/></clipPath>
      </defs>
      <path class="g-fill" d="M8 10 L128 10 L116 236 Q115 248 103 248 L33 248 Q21 248 20 236 Z"/>
      <g clip-path="url(#gclip)">
        <g class="level" id="level" style="transform: translateY(262px)">
          <g class="wave back"><path class="water-back" d="M0 6 Q30 12 60 6 T120 6 T180 6 T240 6 T300 6 T360 6 T420 6 T480 6 V320 H0 Z"/></g>
          <g class="wave"><path class="water" d="M0 4 Q30 -2 60 4 T120 4 T180 4 T240 4 T300 4 T360 4 T420 4 T480 4 V320 H0 Z"/></g>
        </g>
      </g>
      <path class="g-line" fill="none" d="M8 10 L128 10 L116 236 Q115 248 103 248 L33 248 Q21 248 20 236 Z"/>
    </svg>
    <span class="t">
      <span class="eyebrow" data-i18n="today"></span>
      <span class="big"><span id="total">0</span><span class="unit" id="unit1"></span></span>
      <span class="sub" id="sub"></span>
      <span class="pill" id="pill"></span>
      <span class="more" id="moreLink"></span>
    </span>
  </button>

  <div class="note" id="note" role="status"><span id="noteText"></span><button type="button" id="undo" hidden></button></div>

  <section class="controls" aria-labelledby="lblAmount">
    <p class="label" id="lblAmount" data-i18n="chooseAmount"></p>
    <div class="chips" id="chips"></div>
    <div class="custom" id="customRow" hidden>
      <button type="button" class="sbtn" id="cDown" data-i18n-aria="lower">−</button>
      <div class="field">
        <label class="sr" for="custom" data-i18n="amountLabel"></label>
        <input id="custom" type="number" inputmode="numeric" min="10" max="2000" step="10" value="250">
        <span class="u" id="unit2"></span>
      </div>
      <button type="button" class="sbtn" id="cUp" data-i18n-aria="raise">+</button>
    </div>
    <div class="acts">
      <button type="button" class="act rem" id="rem" data-live><span class="a" id="remA"></span><span class="m" id="remM"></span></button>
      <button type="button" class="act add" id="add" data-live><span class="a" id="addA"></span><span class="m" id="addM"></span></button>
    </div>
  </section>
</main>

<section class="panel" id="pDetails" role="dialog" aria-modal="true" aria-labelledby="tDetails" hidden>
  <div class="pwrap">
    <header class="phead">
      <button type="button" class="back" data-back data-i18n-aria="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button>
      <h2 id="tDetails" data-i18n="details"></h2>
    </header>
    <div class="dsum">
      <p class="d" id="dDate"></p>
      <p class="s" id="dSum"></p>
    </div>
    <section class="sec">
      <h3 data-i18n="drinks"></h3>
      <ul class="log" id="log"></ul>
    </section>
    <section class="sec">
      <h3 data-i18n="week"></h3>
      <div class="weekbox">
        <svg class="chart" id="chart" viewBox="0 0 360 192" role="img"></svg>
        <div class="legend">
          <span><i class="sw"></i><b id="lgMet" style="font-weight: 500"></b></span>
          <span><i class="sw below"></i><b id="lgBelow" style="font-weight: 500"></b></span>
          <span><i class="sw dash"></i><b id="lgGoal" style="font-weight: 500"></b></span>
        </div>
        <div class="stats3">
          <div><p class="k" id="kMet"></p><p class="v" id="sMet"></p></div>
          <div><p class="k" id="kAvg"></p><p class="v" id="sAvg"></p></div>
          <div><p class="k" id="kStreak"></p><p class="v" id="sStreak"></p></div>
        </div>
      </div>
    </section>
  </div>
</section>

<section class="panel" id="pPrefs" role="dialog" aria-modal="true" aria-labelledby="tPrefs" hidden>
  <div class="pwrap">
    <header class="phead">
      <button type="button" class="back" data-back data-i18n-aria="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg></button>
      <h2 id="tPrefs" data-i18n="settings"></h2>
    </header>

    <div class="row">
      <label class="rl" for="goal" data-i18n="goalLabel"></label>
      <div class="stepper">
        <button type="button" id="gDown" data-i18n-aria="lowerGoal" data-live>−</button>
        <input id="goal" type="number" inputmode="numeric" min="500" max="6000" step="100" value="2000" data-live>
        <button type="button" id="gUp" data-i18n-aria="raiseGoal" data-live>+</button>
      </div>
      <p class="hintline" id="goalUnit"></p>
    </div>

    <div class="row">
      <p class="rl" id="lblLang" data-i18n="langLabel"></p>
      <div class="seg" role="group" aria-labelledby="lblLang">
        <button type="button" data-lang="en" data-live>English</button>
        <button type="button" data-lang="mn" data-live>Монгол</button>
        <button type="button" data-lang="ja" data-live>日本語</button>
      </div>
    </div>

    <div class="row">
      <p class="rl" id="lblTime" data-i18n="timeLabel"></p>
      <div class="seg" role="group" aria-labelledby="lblTime">
        <button type="button" data-tf="auto" data-i18n="tAuto" data-live></button>
        <button type="button" data-tf="12h" data-i18n="t12" data-live></button>
        <button type="button" data-tf="24h" data-i18n="t24" data-live></button>
      </div>
      <p class="hintline" id="timeExample"></p>
    </div>

    <div class="row">
      <p class="rl" data-i18n="storageLabel"></p>
      <p class="status" id="status" role="status"></p>
    </div>
  </div>
</section>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return document.querySelectorAll(s); };
  var LOC = { en: 'en-US', mn: 'mn-MN', ja: 'ja-JP' };
  var SIZES = [{ k: 'sip', ml: 100 }, { k: 'glass', ml: 250 }, { k: 'mug', ml: 350 }, { k: 'bottle', ml: 500 }];

  var STR = {

  function detectLang() {
    var l = ((navigator.language || 'en') + '').toLowerCase();
    if (l.indexOf('ja') === 0) return 'ja';
    if (l.indexOf('mn') === 0) return 'mn';
    return 'en';
  }

  var state = { goal: 2000, lang: detectLang(), timeFormat: 'auto', days: {}, loaded: false, sel: 250, custom: false };
  try {
    var savedSel = JSON.parse(localStorage.getItem('water-log-sel'));
    if (savedSel && savedSel.ml >= 10 && savedSel.ml <= 2000) { state.sel = savedSel.ml; state.custom = !!savedSel.custom; }
  } catch (e) {}
  function saveSel() { try { localStorage.setItem('water-log-sel', JSON.stringify({ ml: state.sel, custom: state.custom })); } catch (e) {} }

  var backend = null;
  var mode = 'pending';
  var renderedKey = '';
  var statusKey = 'statusLoading', statusKind = '';

  function t(key, v) {
    var s = STR[state.lang] && STR[state.lang][key];
    if (s == null) s = STR.en[key];
    if (s == null) return key;
    if (v) Object.keys(v).forEach(function (k) { s = s.split('{' + k + '}').join(v[k]); });
    return s;
  }
  var fmt = function (n) { return Math.round(n).toLocaleString('en-US'); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var keyOf = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var addDays = function (key, n) { var p = key.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] + n, 12); };
  var todayKey = function () { return keyOf(new Date()); };

  function fmtTime(ts) {
    var o = { hour: 'numeric', minute: '2-digit' };
    if (state.timeFormat === '12h') o.hourCycle = 'h12';
    else if (state.timeFormat === '24h') { o.hourCycle = 'h23'; o.hour = '2-digit'; }
    try { return new Date(ts).toLocaleTimeString(LOC[state.lang], o); } catch (e) { return new Date(ts).toLocaleTimeString(); }
  }
  function fmtDate(d, opts) {
    try { return d.toLocaleDateString(LOC[state.lang], opts); } catch (e) { return d.toLocaleDateString(undefined, opts); }
  }

  function totalOf(key) {
    var d = state.days[key];
    var s = d ? d.entries.reduce(function (a, e) { return a + e.ml; }, 0) : 0;
    return Math.max(0, s);
  }

  /* ---------- status ---------- */
  function setStatus(key, kind) {
    statusKey = key; statusKind = kind || '';
    var el = $('#status');
    el.textContent = t(key);
    el.className = 'status' + (kind === 'warn' ? ' warn' : '');
  }
  function savedKey() { return mode === 'db' ? 'statusSavedDb' : 'statusSavedLocal'; }

  /* ---------- storage ---------- */
  function localBackend() {
    var K = 'water-log-v1';
    try {
      var d = JSON.parse(localStorage.getItem(K)) || {};
      state.goal = d.goal || 2000;
      state.days = d.days || {};
      if (LOC[d.lang]) state.lang = d.lang;
      if (d.timeFormat === '12h' || d.timeFormat === '24h' || d.timeFormat === 'auto') state.timeFormat = d.timeFormat;
    } catch (e) {}
    var persist = function () {
      try { localStorage.setItem(K, JSON.stringify({ goal: state.goal, lang: state.lang, timeFormat: state.timeFormat, days: state.days })); } catch (e) {}
      return Promise.resolve();
    };
    return { saveDay: persist, saveSettings: persist };
  }

  var inflight = 0, latest = null, loadTimer = null;
  function track(p) {
    inflight++;
    return p.finally(function () {
      inflight--;
      if (inflight === 0 && latest) applySnapshot(latest);
    });
  }

  function applySnapshot(snap) {
    latest = snap;
    if (inflight > 0) return;
    var days = {}, goal = state.goal, lang = state.lang, tf = state.timeFormat;
    snap.docs.forEach(function (d) {
      var data = d.data() || {};
      if (d.id === 'settings') {
        if (typeof data.goal === 'number') goal = data.goal;
        if (LOC[data.lang]) lang = data.lang;
        if (data.timeFormat === '12h' || data.timeFormat === '24h' || data.timeFormat === 'auto') tf = data.timeFormat;
      } else if (d.id.indexOf('d-') === 0) {
        var list = Array.isArray(data.entries) ? data.entries : [];
        var entries = list.filter(function (x) { return x && typeof x.ml === 'number' && x.ml !== 0; })
          .map(function (x) { return { id: String(x.id), t: Number(x.t) || 0, ml: x.ml }; });
        if (entries.length) days[d.id.slice(2)] = { entries: entries };
      }
    });
    state.days = days; state.goal = goal; state.lang = lang; state.timeFormat = tf;
    state.loaded = true;
    if (!snap.metadata.fromCache) { clearTimeout(loadTimer); setStatus(savedKey()); }
    applyLang();
    render();
  }

  async function dbBackend() {
    if (!window.claude || !window.claude.use) return null;
    var db = await window.claude.use('db');
    var user = await window.claude.use('user');
    if (!db || !user) return null;
    var uid = await user.id();
    if (!uid) return null;
    var col = db.collection('data/users/' + uid);
    var chains = {};
    var queue = function (k, fn) {
      chains[k] = (chains[k] || Promise.resolve()).catch(function () {}).then(fn);
      return chains[k];
    };
    return {
      subscribe: function (onErr) { return col.onSnapshot(applySnapshot, onErr); },
      saveDay: function (key) {
        return track(queue('d-' + key, function () {
          var day = state.days[key];
          var entries = day ? day.entries.slice() : [];
          var ref = col.doc('d-' + key);
          if (!entries.length) return ref.delete();
          return ref.set({ date: key, entries: entries, total: entries.reduce(function (a, e) { return a + e.ml; }, 0) });
        }));
      },
      saveSettings: function () {
        return track(queue('settings', function () {
          return col.doc('settings').set({ goal: state.goal, lang: state.lang, timeFormat: state.timeFormat });
        }));
      }
    };
  }

  function persistDay(key) {
    setStatus('statusSaving');
    Promise.resolve(backend.saveDay(key)).then(function () { setStatus(savedKey()); },
      function () { setStatus('statusErr', 'warn'); });
  }
  var settingsTimer = null;
  function persistSettingsSoon() {
    clearTimeout(settingsTimer);
    settingsTimer = setTimeout(function () {
      setStatus('statusSaving');
      Promise.resolve(backend.saveSettings()).then(function () { setStatus(savedKey()); },
        function () { setStatus('statusErr', 'warn'); });
    }, 400);
  }

  /* ---------- note (undo / errors) ---------- */
  var noteTimer = null, noteId = null;
  function clearNote() {
    clearTimeout(noteTimer); noteId = null;
    var n = $('#note');
    n.className = 'note';
    $('#noteText').textContent = '';
    $('#undo').hidden = true;
  }
  function showNote(text, id, isErr) {
    clearTimeout(noteTimer);
    var n = $('#note');
    n.className = 'note ' + (isErr ? 'err' : 'on');
    $('#noteText').textContent = text;
    noteId = isErr ? null : id;
    $('#undo').hidden = isErr;
    noteTimer = setTimeout(clearNote, isErr ? 4000 : 5000);
  }

  /* ---------- actions ---------- */
  function validSel() { return state.sel >= 10 && state.sel <= 2000; }

  function logAmount(sign) {
    var ml = Math.round(state.sel);
    if (!(ml >= 10 && ml <= 2000)) { showNote(t('badAmount'), null, true); return; }
    var k = todayKey();
    if (sign < 0 && totalOf(k) < ml) { showNote(t('cantRemove'), null, true); return; }
    var day = state.days[k] || (state.days[k] = { entries: [] });
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    day.entries.push({ id: id, t: Date.now(), ml: sign * ml });
    render();
    persistDay(k);
    showNote(t(sign > 0 ? 'added' : 'removed', { n: fmt(ml) }), id, false);
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
  }

  function removeEntry(id) {
    var k = todayKey();
    var day = state.days[k];
    if (!day) return;
    day.entries = day.entries.filter(function (e) { return e.id !== id; });
    if (!day.entries.length) delete state.days[k];
    render();
    persistDay(k);
  }

  function setGoal(v) {
    v = Math.round(v / 50) * 50;
    if (!isFinite(v)) return;
    state.goal = Math.min(6000, Math.max(500, v));
    render();
    persistSettingsSoon();
  }

  /* ---------- language ---------- */
  function applyLang() {
    document.documentElement.lang = state.lang;
    $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    $$('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
    $('#undo').textContent = t('undo');
    $('#chart').setAttribute('aria-label', t('chartAria'));
    setStatus(statusKey, statusKind);
  }

  /* ---------- render ---------- */
  function buildChips() {
    var box = $('#chips');
    box.textContent = '';
    SIZES.forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.setAttribute('data-k', s.k); b.setAttribute('data-ml', s.ml);
      b.innerHTML = '<span class="n"></span><span class="v"></span>';
      b.addEventListener('click', function () { state.sel = s.ml; state.custom = false; saveSel(); render(); });
      box.appendChild(b);
    });
    var o = document.createElement('button');
    o.type = 'button'; o.className = 'chip'; o.setAttribute('data-k', 'other');
    o.innerHTML = '<span class="n"></span><span class="v">…</span>';
    o.addEventListener('click', function () {
      state.custom = true;
      if (!validSel()) state.sel = 250;
      saveSel(); render();
      var ci = $('#custom'); ci.focus(); try { ci.select(); } catch (e) {}
    });
    box.appendChild(o);
  }

  function renderControls() {
    $$('#chips .chip').forEach(function (c) {
      var k = c.getAttribute('data-k');
      c.querySelector('.n').textContent = t(k);
      var pressed = k === 'other' ? state.custom : (!state.custom && Number(c.getAttribute('data-ml')) === state.sel);
      if (k !== 'other') c.querySelector('.v').textContent = c.getAttribute('data-ml');

    $('#remM').textContent = amt;

  function renderHero(total, goal) {
    $('#total').textContent = fmt(total);
    $('#unit1').textContent = t('unit');
    $('#sub').textContent = t('goalLine', { n: fmt(goal) });
    var pill = $('#pill');
    if (total >= goal) {
      pill.className = 'pill done';
      pill.textContent = total > goal ? t('over', { n: fmt(total - goal) }) : t('reached');
    } else {
      pill.className = 'pill';
      pill.textContent = t('toGo', { n: fmt(goal - total) });
    }
    $('#moreLink').textContent = t('details') + ' ›';
    $('#hero').setAttribute('aria-label', t('detailsAria') + ': ' + fmt(total) + ' / ' + fmt(goal) + ' ' + t('unit'));
    var pct = Math.min(total / goal, 1);
    $('#level').style.transform = 'translateY(' + (pct === 0 ? 262 : 248 - 238 * pct) + 'px)';
  }

  function renderDetails(total, goal) {
    $('#dDate').textContent = fmtDate(new Date(), { weekday: 'long', month: 'long', day: 'numeric' });
    $('#dSum').innerHTML = fmt(total) + ' / ' + fmt(goal) + ' <small>' + t('unit') + ' · ' + Math.round(total / goal * 100) + '%</small>';

    var ul = $('#log');
    ul.textContent = '';
    var day = state.days[todayKey()];
    if (!day || !day.entries.length) {
      var p = document.createElement('li');
      p.className = 'empty'; p.style.display = 'block';
      p.textContent = t('none');
      ul.appendChild(p);
    } else {
      day.entries.slice().sort(function (a, b) { return b.t - a.t; }).forEach(function (e) {
        var li = document.createElement('li');
        var tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = fmtTime(e.t);
        var am = document.createElement('span'); am.className = 'am' + (e.ml < 0 ? ' neg' : '');
        am.textContent = (e.ml > 0 ? '+' : '−') + fmt(Math.abs(e.ml)) + ' ' + t('unit');
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'rm'; b.setAttribute('data-live', '');
        b.setAttribute('aria-label', t('delEntry')); b.textContent = '×';
        b.disabled = !state.loaded;
        b.addEventListener('click', function () { removeEntry(e.id); });
        li.appendChild(tm); li.appendChild(am); li.appendChild(b);
        ul.appendChild(li);
      });
    }

    var tk = todayKey();
    var keys = [];
    for (var i = 6; i >= 0; i--) keys.push(keyOf(addDays(tk, -i)));
    var totals = keys.map(totalOf);
    var max = Math.max.apply(null, [goal].concat(totals)) * 1.12;
    var W = 360, base = 150, top = 26, H = base - top, slot = W / 7, bw = 30;
    var s = '<line class="base" x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '"/>';
    var gy = base - goal / max * H;
    s += '<line class="goal-line" x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '"/>';
    keys.forEach(function (k, i) {
      var tot = totals[i], met = tot >= goal;
      var h = tot > 0 ? Math.max(3, tot / max * H) : 0;
      var x = i * slot + (slot - bw) / 2, cx = i * slot + slot / 2;
      if (h > 0) s += '<rect class="bar' + (met ? ' met' : '') + '" x="' + x + '" y="' + (base - h) + '" width="' + bw + '" height="' + h + '" rx="5"/>';
      s += '<text class="c-val' + (met ? ' met' : '') + '" x="' + cx + '" y="' + (base - h - 6) + '">' + (tot > 0 ? fmt(tot) : '–') + '</text>';
      var d = addDays(k, 0), isNow = i === 6;
      s += '<text class="c-day' + (isNow ? ' now' : '') + '" x="' + cx + '" y="170">' + (isNow ? t('todayShort') : fmtDate(d, { weekday: 'short' })) + '</text>';
      s += '<text class="c-day" x="' + cx + '" y="185">' + d.getDate() + '</text>';
    });
    $('#chart').innerHTML = s;
    $('#lgMet').textContent = t('legendMet');
    $('#lgBelow').textContent = t('legendBelow');
    $('#lgGoal').textContent = t('legendGoal', { n: fmt(goal) });

    var metCount = totals.filter(function (v) { return v >= goal; }).length;
    var logged = totals.filter(function (v) { return v > 0; });
    var avg = logged.length ? logged.reduce(function (a, b) { return a + b; }, 0) / logged.length : 0;
    var k2 = tk;
    if (totalOf(k2) < goal) k2 = keyOf(addDays(k2, -1));
    var streak = 0;
    while (totalOf(k2) >= goal && streak < 400) { streak++; k2 = keyOf(addDays(k2, -1)); }
    $('#kMet').textContent = t('sMet');
    $('#kAvg').textContent = t('sAvg');
    $('#kStreak').textContent = t('sStreak');
    $('#sMet').textContent = t('sMetVal', { n: metCount });
    $('#sAvg').textContent = avg ? t('sAvgVal', { n: fmt(avg) }) : '–';
    $('#sStreak').textContent = t(streak === 1 ? 'dayOne' : 'dayMany', { n: streak });
  }

  function renderPrefs() {
    var gi = $('#goal');
    if (document.activeElement !== gi) gi.value = state.goal;
    $('#goalUnit').textContent = t('goalUnit');
    $$('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-lang') === state.lang ? 'true' : 'false'); });
    $$('[data-tf]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-tf') === state.timeFormat ? 'true' : 'false'); });
    $('#timeExample').textContent = t('example', { t: fmtTime(Date.now()) });
  }

  function render() {
    renderedKey = todayKey();
    var total = totalOf(renderedKey), goal = state.goal;
    renderHero(total, goal);
    renderControls();
    renderDetails(total, goal);
    renderPrefs();
    $$('[data-live]').forEach(function (el) { el.disabled = !state.loaded; });
  }

  /* ---------- panels (hash: #details, #prefs) ---------- */
  var panels = { details: $('#pDetails'), prefs: $('#pPrefs') };
  var current = null, opener = null, navDepth = 0;
  function showPanel(name) {
    current = name;
    Object.keys(panels).forEach(function (k) { panels[k].hidden = (k !== name); });
    document.body.style.overflow = name ? 'hidden' : '';
    if (name) {
      panels[name].scrollTop = 0;
      var b = panels[name].querySelector('.back');
      if (b) b.focus({ preventScroll: true });
    } else if (opener) {
      try { opener.focus({ preventScroll: true }); } catch (e) {}
    }
  }
  function openPanel(name, el) {
    opener = el || null;
    if (location.hash === '#' + name) { showPanel(name); return; }
    navDepth = 1;
    location.hash = name;
  }
  function closePanel() {
    if (navDepth) { navDepth = 0; history.back(); return; }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    showPanel(null);
  }
  window.addEventListener('hashchange', function () {
    var h = location.hash.slice(1);
    showPanel(panels[h] ? h : null);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && current) closePanel(); });

  /* ---------- events ---------- */
  $('#hero').addEventListener('click', function () { openPanel('details', $('#hero')); });
  $('#openPrefs').addEventListener('click', function () { openPanel('prefs', $('#openPrefs')); });
  $$('[data-back]').forEach(function (b) { b.addEventListener('click', closePanel); });

  $('#add').addEventListener('click', function () { logAmount(1); });
  $('#rem').addEventListener('click', function () { logAmount(-1); });
  $('#undo').addEventListener('click', function () { var id = noteId; clearNote(); if (id) removeEntry(id); });

  $('#custom').addEventListener('input', function (e) {
    var v = Math.round(Number(e.target.value));
    state.sel = isFinite(v) && v > 0 ? v : 0;
    saveSel();
    renderControls();
  });
  function stepCustom(d) {
    var v = validSel() ? state.sel : 250;
    state.sel = Math.min(2000, Math.max(10, Math.round((v + d) / 10) * 10));
    saveSel(); render();
  }
  $('#cDown').addEventListener('click', function () { stepCustom(-50); });
  $('#cUp').addEventListener('click', function () { stepCustom(50); });

  $('#goal').addEventListener('change', function (e) { setGoal(Number(e.target.value)); });
  $('#gDown').addEventListener('click', function () { setGoal(state.goal - 100); });
  $('#gUp').addEventListener('click', function () { setGoal(state.goal + 100); });
  $$('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.lang = b.getAttribute('data-lang');
      applyLang(); render(); persistSettingsSoon();
    });
  });
  $$('[data-tf]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.timeFormat = b.getAttribute('data-tf');
      render(); persistSettingsSoon();
    });
  });

  function checkRollover() { if (todayKey() !== renderedKey) render(); }
  setInterval(checkRollover, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkRollover(); });

  /* ---------- start ---------- */
  buildChips();
  applyLang();
  render();
  var h0 = location.hash.slice(1);
  if (panels[h0]) showPanel(h0);
  (async function () {
    var b = null;
    try { b = await dbBackend(); } catch (e) { b = null; }
    if (!b) {
      mode = 'local';
      backend = localBackend();
      state.loaded = true;
      setStatus(savedKey());
      applyLang(); render();
      return;
    }
    mode = 'db';
    backend = b;
    loadTimer = setTimeout(function () { setStatus(state.loaded ? 'statusStale' : 'statusUnreach', 'warn'); }, 10000);
    b.subscribe(function () { setStatus('statusUnavail', 'warn'); });
  })();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
